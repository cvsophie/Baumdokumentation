<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fletzer Baumdokumentation</title>
  <!-- Tailwind & jsPDF -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .bg-forest { background-color: #123925; }
    .text-forest { color: #123925; }
    .hover-forest:hover { background-color: #0c2618; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  <!-- Kopfzeile -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-forest text-white font-bold flex items-center justify-center text-lg">F</div>
        <span class="text-lg font-bold text-gray-900 tracking-tight">Fletzer Baumdokumentation</span>
      </div>
      <button id="btnDownload" class="px-4 py-2 bg-forest hover-forest text-white text-sm font-semibold rounded-lg shadow transition">
        📄 PDF-Report herunterladen
      </button>
    </div>
  </header>

  <!-- Hauptbereich -->
  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-12 gap-8">
    
    <!-- Linke Spalte: Stammdaten & Upload -->
    <div class="md:col-span-5 space-y-6">
      
      <!-- 1. Stammdaten -->
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
        <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wide border-b pb-2">1. Stammdaten (Deckblatt)</h2>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Auftraggeber *</label>
          <input type="text" id="client" value="Magistrat Wien" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Adresse / Standort *</label>
          <input type="text" id="address" value="Stadtpark 1" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
        </div>

        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">PLZ *</label>
            <input type="text" id="zip" value="1010" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          </div>
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Ort *</label>
            <input type="text" id="city" value="Wien" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Datum *</label>
          <input type="date" id="date" class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-800">
        </div>

        <!-- IstND Checkbox -->
        <div class="pt-2 border-t">
          <label class="flex items-center space-x-2 text-sm font-semibold cursor-pointer">
            <input type="checkbox" id="isNd" class="w-4 h-4 rounded text-emerald-800 focus:ring-emerald-800">
            <span>Naturdenkmal (IstND)</span>
          </label>
          <div id="ndBox" class="hidden mt-2">
            <label class="block text-xs text-gray-500 mb-1">ND-Nummer (optional)</label>
            <input type="text" id="ndNum" placeholder="z. B. ND-102" class="w-full px-3 py-2 border rounded-lg text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Gesamtfazit</label>
          <textarea id="notes" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm">Regelmäßige Kontrolle durchgeführt. Befunde und Maßnahmen siehe Folgeseiten.</textarea>
        </div>
      </div>

      <!-- 2. Foto Upload -->
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
        <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wide border-b pb-2">2. Fotos hinzufügen</h2>
        
        <!-- Versteckte Inputs -->
        <input type="file" id="inputFiles" multiple accept="image/*" class="hidden">
        <input type="file" id="inputFolder" webkitdirectory directory multiple class="hidden">

        <!-- Upload Buttons (sauber getrennt, keine Klick-Konflikte) -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="btnTriggerFiles" class="w-full py-3 px-3 bg-white border-2 border-dashed border-gray-300 hover:border-emerald-700 rounded-xl text-center transition flex flex-col items-center justify-center">
            <span class="text-xl">📸</span>
            <span class="text-xs font-bold text-gray-800 mt-1">Fotos wählen</span>
            <span class="text-[10px] text-gray-400">Einzeln oder mehrere</span>
          </button>

          <button type="button" id="btnTriggerFolder" class="w-full py-3 px-3 bg-emerald-50/50 border-2 border-dashed border-emerald-300 hover:border-emerald-700 rounded-xl text-center transition flex flex-col items-center justify-center">
            <span class="text-xl">📁</span>
            <span class="text-xs font-bold text-emerald-900 mt-1">Ordner wählen</span>
            <span class="text-[10px] text-emerald-700">Ganzen Foto-Ordner</span>
          </button>
        </div>

        <!-- Drag & Drop Zone -->
        <div id="dropZone" class="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center text-xs text-gray-500 hover:bg-gray-50 transition">
          Oder Fotos per Drag & Drop hier ablegen
        </div>
      </div>

    </div>

    <!-- Rechte Spalte: Foto-Liste & Beschreibungen -->
    <div class="md:col-span-7">
      <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h2 class="text-sm font-bold text-gray-900 uppercase tracking-wide">
            3. Fotoseiten (<span id="photoCount">0</span> Fotos)
          </h2>
          <span class="text-xs text-gray-400">Jedes Foto = 1 eigene A4-Seite</span>
        </div>

        <div id="photoContainer" class="space-y-4">
          <div id="emptyMsg" class="py-16 text-center text-gray-400 text-sm">
            Noch keine Fotos hochgeladen. Klicke links auf <b>Fotos wählen</b> oder <b>Ordner wählen</b>.
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // 1. Datum initialisieren
    document.getElementById('date').value = new Date().toISOString().split('T')[0];

    // 2. Naturdenkmal Einblenden/Ausblenden
    const isNd = document.getElementById('isNd');
    const ndBox = document.getElementById('ndBox');
    isNd.addEventListener('change', () => ndBox.classList.toggle('hidden', !isNd.checked));

    // 3. Status-Array für Fotos
    let photos = [];

    // Elemente
    const inputFiles = document.getElementById('inputFiles');
    const inputFolder = document.getElementById('inputFolder');
    const btnTriggerFiles = document.getElementById('btnTriggerFiles');
    const btnTriggerFolder = document.getElementById('btnTriggerFolder');
    const dropZone = document.getElementById('dropZone');
    const photoContainer = document.getElementById('photoContainer');
    const emptyMsg = document.getElementById('emptyMsg');
    const photoCount = document.getElementById('photoCount');
    const btnDownload = document.getElementById('btnDownload');

    // Klick-Handler sauber verknüpfen
    btnTriggerFiles.onclick = () => inputFiles.click();
    btnTriggerFolder.onclick = () => inputFolder.click();

    inputFiles.onchange = (e) => handleSelectedFiles(e.target.files);
    inputFolder.onchange = (e) => handleSelectedFiles(e.target.files);

    // Drag and Drop
    ['dragenter', 'dragover'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('border-emerald-600', 'bg-emerald-50'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('border-emerald-600', 'bg-emerald-50'); });
    });
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files.length) {
        handleSelectedFiles(e.dataTransfer.files);
      }
    });

    // Bildverarbeitung (Skalieren auf web-freundliche Größe gegen Speicherabstürze)
    function processImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const max = 1400;
            let w = img.width, h = img.height;
            if (w > max || h > max) {
              if (w > h) { h = Math.round((h * max) / w); w = max; }
              else { w = Math.round((w * max) / h); h = max; }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve({
              id: 'id_' + Math.random().toString(36).substr(2, 9),
              filename: file.name,
              dataUrl: canvas.toDataURL('image/jpeg', 0.8),
              width: w,
              height: h,
              title: file.name.replace(/\.[^/.]+$/, ""),
              description: 'Befund zur Schadstelle bzw. Auffälligkeit am Baum.'
            });
          };
          img.onerror = () => resolve(null);
          img.src = e.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    async function handleSelectedFiles(fileList) {
      const files = Array.from(fileList).filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
      if (!files.length) {
        alert('Keine gültigen Bilddateien erkannt.');
        return;
      }
      for (const f of files) {
        const p = await processImage(f);
        if (p) photos.push(p);
      }
      renderList();
      inputFiles.value = '';
      inputFolder.value = '';
    }

    function renderList() {
      photoCount.innerText = photos.length;
      if (photos.length === 0) {
        emptyMsg.classList.remove('hidden');
        photoContainer.innerHTML = '';
        photoContainer.appendChild(emptyMsg);
        return;
      }
      emptyMsg.classList.add('hidden');
      photoContainer.innerHTML = '';

      photos.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = "flex flex-col sm:flex-row gap-4 p-4 border rounded-xl bg-gray-50/50 items-start";
        card.innerHTML = `
          <div class="relative w-full sm:w-36 h-28 bg-gray-200 rounded-lg overflow-hidden flex-shrink-0">
            <img src="${p.dataUrl}" class="w-full h-full object-cover">
            <span class="absolute top-1 left-1 bg-black/75 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">
              Seite ${idx + 2}
            </span>
          </div>
          <div class="flex-1 w-full space-y-2">
            <div class="flex justify-between items-center">
              <input type="text" value="${p.title}" class="font-bold text-sm bg-transparent border-b border-gray-300 focus:outline-none focus:border-forest w-full mr-2" oninput="photos[${idx}].title = this.value">
              <button onclick="deletePhoto(${idx})" class="text-red-500 text-xs hover:underline flex-shrink-0">Löschen</button>
            </div>
            <textarea rows="2" class="w-full p-2 text-xs border rounded-lg bg-white" placeholder="Beschreibung..." oninput="photos[${idx}].description = this.value">${p.description}</textarea>
            <div class="text-[10px] text-gray-400 truncate">${p.filename}</div>
          </div>
        `;
        photoContainer.appendChild(card);
      });
    }

    window.deletePhoto = (idx) => {
      photos.splice(idx, 1);
      renderList();
    };

    // 4. PDF Erstellung via jsPDF
    btnDownload.onclick = () => {
      try {
        btnDownload.disabled = true;
        btnDownload.innerText = 'PDF wird generiert...';

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });

        const client = document.getElementById('client').value || '-';
        const address = document.getElementById('address').value || '-';
        const zip = document.getElementById('zip').value || '';
        const city = document.getElementById('city').value || '';
        const date = document.getElementById('date').value || '-';
        const isNdVal = document.getElementById('isNd').checked;
        const ndNumVal = document.getElementById('ndNum').value || '-';
        const notes = document.getElementById('notes').value || '';

        // --- SEITE 1: STAMMDATEN ---
        doc.setFillColor(18, 57, 37); // dunkelgrün
        doc.rect(0, 0, 210, 28, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.text("Fletzer Baumdokumentation", 20, 15);
        doc.setFontSize(9);
        doc.setFont('helvetica', 'normal');
        doc.text("BAUMKONTROLL-BERICHT", 20, 22);

        // Kasten Stammdaten
        doc.setDrawColor(220, 220, 220);
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(20, 38, 170, 70, 2, 2, 'FD');

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(18, 57, 37);
        doc.text("1. STAMMDATEN", 26, 48);
        doc.line(26, 51, 184, 51);

        doc.setFontSize(9);
        const meta = [
          ["Auftraggeber:", client],
          ["Standort:", `${address}, ${zip} ${city}`],
          ["Datum:", date],
          ["Naturdenkmal (IstND):", isNdVal ? `JA (Nr: ${ndNumVal})` : "NEIN"],
          ["Fotos im Anhang:", `${photos.length} Fotoseite(n)`]
        ];

        let y = 60;
        meta.forEach(([k, v]) => {
          doc.setFont('helvetica', 'bold');
          doc.setTextColor(100, 100, 100);
          doc.text(k, 26, y);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(20, 20, 20);
          doc.text(v, 75, y);
          y += 8;
        });

        // Kasten Fazit
        doc.roundedRect(20, 118, 170, 45, 2, 2, 'FD');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(18, 57, 37);
        doc.text("2. ZUSAMMENFASSUNG", 26, 128);
        doc.line(26, 131, 184, 131);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(40, 40, 40);
        const splitNotes = doc.splitTextToSize(notes, 158);
        doc.text(splitNotes, 26, 139);

        // Kasten Übersicht
        doc.roundedRect(20, 173, 170, 95, 2, 2, 'FD');
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(18, 57, 37);
        doc.text("3. ÜBERSICHT DER BILDDOKUMENTATION", 26, 183);
        doc.line(26, 186, 184, 186);

        let py = 195;
        doc.setFontSize(8.5);
        if (photos.length === 0) {
          doc.setFont('helvetica', 'italic');
          doc.setTextColor(120, 120, 120);
          doc.text("Keine Fotos vorhanden.", 26, py);
        } else {
          photos.slice(0, 9).forEach((p, i) => {
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(30, 30, 30);
            doc.text(`Seite ${i + 2}: ${p.title}`, 26, py);
            py += 7;
          });
          if (photos.length > 9) {
            doc.text(`... und ${photos.length - 9} weitere Fotoseiten.`, 26, py);
          }
        }

        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text("Fletzer Baumdokumentation · Seite 1", 105, 287, { align: 'center' });

        // --- FOLGESEITEN: JE 1 FOTO PRO SEITE ---
        photos.forEach((p, idx) => {
          doc.addPage('a4', 'p');
          
          // Header Folgeseite
          doc.setFillColor(245, 245, 245);
          doc.rect(0, 0, 210, 14, 'F');
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8);
          doc.setTextColor(18, 57, 37);
          doc.text("Fletzer Baumdokumentation", 20, 9);
          doc.setFont('helvetica', 'normal');
          doc.setTextColor(120, 120, 120);
          doc.text(`${address} · ${date}`, 190, 9, { align: 'right' });

          // Titel
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.setTextColor(18, 57, 37);
          doc.text(`FOTO ${idx + 1}: ${p.title.toUpperCase()}`, 20, 24);

          // Bildbereich skaliert
          const boxW = 170, boxH = 145;
          let w = boxW, h = (p.height / p.width) * boxW;
          if (h > boxH) {
            h = boxH;
            w = (p.width / p.height) * boxH;
          }
          const x = 20 + (boxW - w) / 2;
          const y = 30 + (boxH - h) / 2;

          doc.setFillColor(240, 240, 240);
          doc.roundedRect(20, 30, boxW, boxH, 2, 2, 'F');
          doc.addImage(p.dataUrl, 'JPEG', x, y, w, h);

          // Beschreibung
          doc.setDrawColor(220, 220, 220);
          doc.setFillColor(255, 255, 255);
          doc.roundedRect(20, 185, 170, 85, 2, 2, 'FD');

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(10);
          doc.setTextColor(18, 57, 37);
          doc.text("BEFUND & BESCHREIBUNG:", 26, 196);
          doc.line(26, 199, 184, 199);

          doc.setFont('helvetica', 'normal');
          doc.setFontSize(9.5);
          doc.setTextColor(40, 40, 40);
          const splitDesc = doc.splitTextToSize(p.description || '-', 158);
          doc.text(splitDesc, 26, 208);

          doc.setFontSize(8);
          doc.setTextColor(150, 150, 150);
          doc.text(`Fletzer Baumdokumentation · Seite ${idx + 2} von ${photos.length + 1}`, 105, 287, { align: 'center' });
        });

        // Download auslösen
        doc.save(`Baumbericht_${client.replace(/\s+/g, '_')}.pdf`);
      } catch (err) {
        alert("Fehler beim Erstellen der PDF: " + err.message);
      } finally {
        btnDownload.disabled = false;
        btnDownload.innerText = '📄 PDF-Report herunterladen';
      }
    };
  </script>
</body>
</html>
